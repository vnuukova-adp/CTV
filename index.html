<title>CTV Overview Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&display=swap">
<style>
/* ===== AdPlayer.Pro CTV Cabinet — real design tokens (tokens.css subset) ===== */
:root{
  color-scheme: light;               /* faithful replica of a light-only app */
  --white-1000:#ffffff;
  --black-950:#000919; --black-900:#1a2231; --black-800:#333a48; --black-700:#4d535f;
  --black-600:#666b76; --black-500:#80848d; --black-400:#999da3; --black-300:#b3b6bb;
  --black-150:#d9d9db; --black-100:#e6e7e9; --black-70:#ededed; --black-50:#f2f2f3; --black-30:#f8f8f8;
  --other-emerald-500:#10b981; --other-indigo-500:#6366f1; --other-purple-500:#a855f7;
  --other-green-500:#22c55e; --other-red-500:#ef4444;

  --bg-main:var(--black-30); --bg-panel:var(--white-1000);
  --text-primary:var(--black-950); --text-secondary:var(--black-500); --text-muted:var(--black-600);
  --text-placeholder:var(--black-400);
  --accent:#008bf6;
  --border-default:var(--black-100); --border-tertiary:var(--black-70); --border-input:var(--black-150);
  --success:var(--other-green-500); --danger:var(--other-red-500); --warning:#f97316;
  --danger-bg:#fef2f2; --warning-bg:#fff7ed; --accent-tint:#f2f9ff;
  --ghost-hover-bg:#00000008; --menu-pressed-bg:#0000000f;
  --shadow-sm:0 1px 2px rgba(10,13,18,.05);
  --dash-revenue-fill:var(--other-emerald-500); --dash-requests-fill:var(--other-indigo-500); --dash-impressions-fill:var(--other-purple-500);
  --rail-bg:var(--black-900); --rail-icon:var(--black-500); --rail-hover-bg:var(--black-800); --rail-active-bg:var(--black-700);
  --font-sans:'Exo 2',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --fs-xs:12px; --fs-sm:13px; --fs-md:14px; --fs-lg:16px;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;
  --space-2:2px; --space-4:4px; --space-6:6px; --space-8:8px; --space-12:12px; --space-16:16px; --space-24:24px; --space-32:32px;
  --radius:4px; --radius-lg:8px; --radius-pill:999px;
  --rail-width:64px;
  --shadow-lg:0 12px 16px -4px rgba(10,13,18,.08),0 4px 6px -2px rgba(10,13,18,.03);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-sans);background:var(--bg-main);color:var(--text-primary);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

/* ===== app shell: dark rail + working area ===== */
.app{display:flex;min-height:100vh}
.icon-rail{position:sticky;top:0;align-self:flex-start;height:100vh;width:var(--rail-width);flex:0 0 var(--rail-width);
  background:var(--rail-bg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 0}
.nav-group{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.nav-icon{width:40px;height:40px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;
  color:var(--rail-icon);cursor:pointer;border:0;background:transparent;transition:background .12s,color .12s}
.nav-icon svg{width:22px;height:22px;display:block}
.nav-icon:hover{background:var(--rail-hover-bg);color:#fff}
.nav-icon--active{background:var(--rail-active-bg);color:#fff}
.rail-brand{width:30px;height:30px;margin-bottom:14px}

.work{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.dash-page{display:flex;flex-direction:column;align-items:center;gap:var(--space-32);padding:0 var(--space-32) 56px}
.dash-head,.dash-filters,.dash-metrics-row,.dash-tops-row{width:100%;margin:0 auto}
@media (min-width:992px){.dash-head,.dash-filters,.dash-metrics-row,.dash-tops-row{max-width:960px}}
@media (min-width:1200px){.dash-head,.dash-filters,.dash-metrics-row,.dash-tops-row{max-width:1140px}}
@media (min-width:1400px){.dash-head,.dash-filters,.dash-metrics-row,.dash-tops-row{max-width:1320px}}

/* ===== header ===== */
.dash-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-16);padding:28px 0}
.ep-view-name{margin:0;font-size:36px;line-height:54px;font-weight:var(--fw-regular);color:var(--text-primary);text-wrap:balance}
.dash-subtitle{margin:2px 0 0;font-size:var(--fs-lg);line-height:24px;color:var(--text-muted)}
.dash-timestamp{flex:0 0 auto;font-size:var(--fs-sm);color:var(--text-muted);background:var(--white-1000);
  border:1px solid var(--border-default);border-radius:var(--radius);padding:8px 16px;white-space:nowrap;margin-top:6px}

/* ===== filters (period picker) ===== */
.dash-filters{display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:var(--space-8)}
.field__control{position:relative;width:100%}
.field__select{width:100%;height:40px;appearance:none;-webkit-appearance:none;font-family:var(--font-sans);font-size:var(--fs-md);
  color:var(--text-primary);background:var(--white-1000);border:1px solid var(--border-input);border-radius:var(--radius);
  padding:0 40px 0 40px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field__select:focus{outline:none;border-color:#80c5fb}
.field__icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--text-secondary);pointer-events:none}
.field__chev{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--text-secondary);pointer-events:none;transition:transform .15s}
/* ----- period picker: DS Dropdown (dd-menu / dd-item from components.css) ----- */
.dd{position:relative}
.dd-trigger{text-align:left;display:flex;align-items:center}
/* company scope — shown for advanced-manager; static (non-interactive) in this demo */
.field__select--static{display:flex;align-items:center;cursor:default;color:var(--text-primary)}
.dd-value{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd[data-open="true"] .field__chev{transform:translateY(-50%) rotate(180deg)}
.dd-menu{position:absolute;z-index:50;left:0;right:0;top:calc(100% + 4px);margin:0;padding:8px 0;list-style:none;
  background:var(--bg-panel);border-radius:var(--radius);box-shadow:0 2px 4px rgba(0,0,0,.3);max-height:calc(6.5*44px + 8px);overflow-y:auto}
.dd-item{display:flex;align-items:center;gap:4px;height:44px;padding:12px 12px 12px 16px;
  font-family:var(--font-sans);font-weight:var(--fw-medium);font-size:var(--fs-md);line-height:18px;color:var(--text-primary);cursor:pointer}
.dd-item__label{flex:1 0 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-item:hover,.dd-item--active{background:var(--ghost-hover-bg)}
.dd-item:active{background:var(--menu-pressed-bg)}
.dd-item__check{width:20px;height:20px;color:var(--text-muted);flex-shrink:0}
.dd-item__check svg{width:20px;height:20px;display:block}

/* ===== metric cards (verbatim from style.css) ===== */
.dash-metrics-row,.dash-tops-row{display:flex;gap:var(--space-32);align-items:stretch}
.dash-metrics-row>.dash-metric,.dash-tops-row>.dash-top{flex:1 1 0;min-width:0}
.dash-metric{background:var(--white-1000);border:2px solid var(--border-tertiary);border-radius:var(--radius);overflow:hidden}
.dash-metric-head{height:72px;display:flex;align-items:center;justify-content:space-between;
  padding:var(--space-4) var(--space-24) var(--space-4) var(--space-32);border-radius:var(--radius) var(--radius) 0 0}
.dash-metric-title{color:var(--white-1000);font-weight:600;font-size:var(--fs-lg)}
.dash-metric--revenue .dash-metric-head{background:var(--dash-revenue-fill)}
.dash-metric--requests .dash-metric-head{background:var(--dash-requests-fill)}
.dash-metric--impressions .dash-metric-head{background:var(--dash-impressions-fill)}
.dash-metric-body{display:flex;flex-direction:column}
.dash-stat{box-sizing:border-box;width:100%;display:flex;flex-direction:row;align-items:center;justify-content:space-between;
  gap:var(--space-16);padding:var(--space-24);border-bottom:2px solid var(--border-default)}
.dash-stat:last-child{border-bottom:0}
.dash-stat-main{display:flex;flex-direction:column;gap:var(--space-4);min-width:0}
.dash-stat-spark{flex-shrink:0;display:block;width:100px;height:40px}
.dash-stat-label{font-size:var(--fs-md);font-weight:var(--fw-semibold);line-height:20px;color:var(--text-secondary)}
.dash-stat-figure{display:flex;align-items:flex-end;gap:var(--space-4);flex-wrap:wrap}
.dash-stat-value{font-size:24px;line-height:28px;color:var(--text-primary);font-variant-numeric:tabular-nums}
.dash-stat-date{font-size:var(--fs-xs);line-height:16px;font-weight:500;color:var(--text-secondary);margin-left:var(--space-4)}
.dash-stat-delta{display:inline-flex;align-items:center;gap:var(--space-2);font-size:var(--fs-xs);font-weight:700}
.dash-stat-delta svg{width:11px;height:11px}
.dash-stat-delta--up{color:var(--success)}
.dash-stat-delta--down{color:var(--danger)}
.dash-stat-delta--flat{color:var(--text-muted)}

/* ===== Top cards ===== */
.dash-top{display:flex;flex-direction:column;background:var(--white-1000);border:2px solid var(--border-tertiary);
  border-radius:var(--radius);overflow:hidden;padding-bottom:var(--space-24)}
.dash-top-head{height:72px;display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding:var(--space-4) var(--space-32)}
.dash-top-title{font-size:var(--fs-lg);font-weight:var(--fw-semibold);color:var(--text-primary)}
.dash-top-viewall{font-size:var(--fs-md);font-weight:var(--fw-semibold);line-height:24px;color:var(--text-secondary);text-decoration:none;white-space:nowrap;cursor:pointer}
.dash-top-viewall:hover{color:var(--text-primary);text-decoration:underline}
.dash-top-list{display:flex;flex-direction:column}
.list-item{position:relative;display:flex;align-items:center;gap:var(--space-4);min-height:64px;padding:12px 32px;cursor:pointer;background:var(--bg-panel);transition:background .12s}
.list-item:hover{background:var(--black-50)}
.list-item::after{content:'';position:absolute;left:32px;right:32px;bottom:0;height:1px;background:var(--border-default)}
.dash-top-list .list-item:last-child::after{display:none}
.li-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.li-name{font-size:var(--fs-md);font-weight:var(--fw-semibold);color:var(--text-primary)}
.li-sub{font-size:var(--fs-xs);color:var(--text-secondary)}
.li-chev{width:20px;height:20px;color:var(--black-300);flex:0 0 auto}
.dash-top-empty{padding:var(--space-24);font-size:var(--fs-md);color:var(--text-secondary)}

@media (max-width:991.98px){.dash-metrics-row{flex-direction:column}.dash-metrics-row>.dash-metric{flex:0 0 auto}}
@media (max-width:575.98px){.dash-tops-row{flex-direction:column}.dash-tops-row>.dash-top{flex:0 0 auto}.dash-filters{grid-template-columns:1fr}}

/* ----- version toggle (preview control, not part of the real app) ----- */
.ver-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  padding:10px 32px;background:rgba(248,248,248,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--border-default)}
.ver-bar__label{font-size:var(--fs-xs);font-weight:var(--fw-semibold);letter-spacing:.04em;text-transform:uppercase;color:var(--text-secondary)}
.ver-seg{display:inline-flex;background:var(--black-50);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:3px}
.ver-seg__btn{border:0;background:transparent;font-family:var(--font-sans);font-size:13px;font-weight:var(--fw-semibold);color:var(--text-secondary);
  padding:6px 14px;border-radius:var(--radius-pill);cursor:pointer;transition:background .12s,color .12s}
.ver-seg__btn:hover{color:var(--text-primary)}
.ver-seg__btn.is-active{background:var(--bg-panel);color:var(--text-primary);box-shadow:var(--shadow-sm)}

/* ----- Recently-updated type badge ----- */
.li-badge{display:inline-block;font-size:11px;font-weight:var(--fw-semibold);line-height:1;color:var(--text-muted);
  background:var(--black-50);border:1px solid var(--border-default);border-radius:var(--radius-pill);padding:2px 7px;margin-right:6px;vertical-align:1px}

/* ----- Needs-attention card ----- */
.dash-top-viewall--accent{color:var(--accent)}
.dash-top-viewall--accent:hover{color:var(--accent);text-decoration:underline}
.attn-item{position:relative;display:flex;align-items:center;gap:14px;padding:16px 32px}
.attn-item::after{content:'';position:absolute;left:32px;right:32px;bottom:0;height:1px;background:var(--border-default)}
.attn-item:last-child::after{display:none}
.attn-ico{flex:0 0 auto;width:36px;height:36px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center}
.attn-ico svg{width:20px;height:20px;display:block}
.attn-ico--danger{background:var(--danger-bg);color:var(--danger)}
.attn-ico--warning{background:var(--warning-bg);color:var(--warning)}
.attn-ico--info{background:var(--accent-tint);color:var(--accent)}
.attn-item .li-main{flex:1}
.attn-item .li-name{margin-bottom:2px}
.attn-item .li-sub{color:var(--text-muted)}
.attn-view{flex:0 0 auto;font-size:var(--fs-md);font-weight:var(--fw-semibold);color:var(--accent);text-decoration:none;cursor:pointer;white-space:nowrap}
.attn-view:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

        </div>
        <div class="field__control dd" id="periodDd">
          <svg class="field__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17 4H15V6H17V4ZM19 4H18V7H14V4H10V7H6V4H5C4.4 4 4 4.4 4 5V19C4 19.6 4.4 20 5 20H19C19.6 20 20 19.6 20 19V5C20 4.4 19.6 4 19 4ZM18 18H6V9H18V18ZM9 4H7V6H9V4ZM13 11H11V13H13V11ZM16 11H14V13H16V11ZM10 14H8V16H10V14ZM10 11H8V13H10V11ZM13 14H11V16H13V14ZM16 14H14V16H16V14Z" fill="currentColor"/></svg>
          <button type="button" class="field__select dd-trigger" aria-haspopup="listbox" aria-expanded="false"><span class="dd-value">Today vs yesterday</span></button>
          <svg class="field__chev" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17.5 10.5L12 16L6.5 10.5L8 9L12 13L16 9L17.5 10.5Z" fill="currentColor"/></svg>
          <ul class="dd-menu" role="listbox" hidden></ul>
        </div>
      </div>

      <div class="dash-metrics-row" id="metrics"></div>
      <div class="dash-tops-row" id="tops"></div>
    </div>
  </div>
</div>

<script>
// ---- Version A of the Overview. Figures are illustrative sample data that react
//      to the period picker, so switching a range changes the digits. Version B
//      slots into VERSIONS behind a toggle later.
// Each metric's p[periodKey] = [baseValue, currentValue, baseDelta%, currentDelta%];
// MAX is all-time (constant across periods).
const PERIODS = [
  { key:'tvy', label:'Today vs yesterday', base:'Yesterday',   cur:'Today' },
  { key:'wk',  label:'This week vs last',  base:'Last week',   cur:'This week' },
  { key:'mo',  label:'This month vs last', base:'Last month',  cur:'This month' },
  { key:'d7',  label:'Last 7 days',        base:'Prev 7 days', cur:'Last 7 days' },
];
// Metric cards are shared across versions (period-driven). Versions differ only in
// the two bottom cards — see BOTTOM.
const METRICS = [
  { variant:'revenue', title:'Revenue', money:true, max:6905, maxDate:'Sep 8, 2026',
    p:{ tvy:[4812,2140,8,-18], wk:[30140,26480,12,-6], mo:[128400,140900,15,10], d7:[29600,31450,9,6] } },
  { variant:'requests', title:'Requests', max:32664, maxDate:'Sep 8, 2026',
    p:{ tvy:[30216,13681,12,-51], wk:[196400,181200,7,-8], mo:[842300,905600,11,8], d7:[188900,201400,9,7] } },
  { variant:'impressions', title:'Impressions', max:24110, maxDate:'Sep 8, 2026',
    p:{ tvy:[21540,9320,9,-44], wk:[142800,131500,8,-8], mo:[612400,668900,12,9], d7:[138200,149600,10,8] } },
];
const VERSION_META = { A:{name:'Top lists'}, B:{name:'New items'}, C:{name:'Activity'} };
const BOTTOM = {
  // A — leaderboards by volume/spend
  A: [
    { type:'list', title:'Top Inventory', items:[
      {name:'QA Inventory', sub:'28,450 requests'},
      {name:'Roku — CTV Prime', sub:'19,220 requests'},
      {name:'FireTV — Sports Live', sub:'11,905 requests'},
      {name:'Samsung TV Plus — News', sub:'8,640 requests'},
      {name:'Apple TV — Movies', sub:'6,120 requests'},
    ]},
    { type:'list', title:'Top Demand', items:[
      {name:'Open Exchange — CTV', sub:'$3,120 spend'},
      {name:'PMP Deal — Sports', sub:'$1,884 spend'},
      {name:'Programmatic Guaranteed', sub:'$1,470 spend'},
      {name:'House Direct Tag', sub:'$980 spend'},
      {name:'Fallback Remnant', sub:'$645 spend'},
    ]},
  ],
  // B — most recently added items
  B: [
    { type:'list', title:'New Inventory', items:[
      {name:'Vizio — Home Screen', sub:'added 2h ago'},
      {name:'LG Channels — Kids', sub:'added 5h ago'},
      {name:'Tubi — Late Night', sub:'added yesterday'},
      {name:'Pluto — News 24', sub:'added 2d ago'},
      {name:'Sling — Sports Extra', sub:'added 3d ago'},
    ]},
    { type:'list', title:'New Demand', items:[
      {name:'TTD — CTV Q3 Deal', sub:'added 1h ago'},
      {name:'DV360 — Sports PMP', sub:'added 4h ago'},
      {name:'Amazon DSP — Movies', sub:'added yesterday'},
      {name:'Magnite Open — West', sub:'added 2d ago'},
      {name:'Xandr — Remnant', sub:'added 4d ago'},
    ]},
  ],
  // C — activity: recent edits across entity types + an alerts feed
  C: [
    { type:'list', title:'Recently updated', items:[
      {name:'Roku — CTV Prime', sub:'Inventory · updated 12m ago'},
      {name:'TTD — CTV Q3 Deal', sub:'Demand · updated 40m ago'},
      {name:'US East → Premium', sub:'Route · updated 1h ago'},
      {name:'IAB Brand Safety v3', sub:'Brand Safety · updated 2h ago'},
      {name:'FireTV — Sports Live', sub:'Inventory · updated 3h ago'},
    ]},
    // Each alert is about ONE entity, so View deep-links to that entity's screen.
    { type:'attention', title:'Needs attention', count:3, items:[
      {sev:'danger',  name:'Fill dropped 22% on “Roku Sports → TTD”', sub:'Started ~3h ago. Demand may have paused a deal.', entity:'Roku Sports → TTD route', href:'#/route?id=roku-sports-ttd'},
      {sev:'warning', name:'Error rate up on Magnite endpoint', sub:'1.7% → mostly no-bid timeouts on Pluto Movies.', entity:'Magnite demand endpoint', href:'#/demand?id=magnite'},
      {sev:'info',    name:'Amazon DSP endpoint near daily cap', sub:'At ~92% of today’s budget.', entity:'Amazon DSP demand endpoint', href:'#/demand?id=amazon-dsp'},
    ]},
  ],
};
const FILL = { revenue:'var(--dash-revenue-fill)', requests:'var(--dash-requests-fill)', impressions:'var(--dash-impressions-fill)' };
const SPARK_UP=[6,7,6,8,9,10,12], SPARK_DOWN=[12,11,9,10,7,6,5], SPARK_MAX=[4,6,5,8,7,10,12];

const fmtMoney = n => '$' + n.toLocaleString('en-US');
const fmtNum   = n => n.toLocaleString('en-US');

function sparkSVG(values, color){
  const w=100, h=40, pad=3, min=Math.min(...values), max=Math.max(...values), span=(max-min)||1;
  const pts = values.map((v,i)=>{
    const x = pad + i*( (w-2*pad)/(values.length-1) );
    const y = h-pad - ((v-min)/span)*(h-2*pad);
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  const last = pts.split(' ').pop().split(',');
  return `<svg class="dash-stat-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="${color}"/></svg>`;
}
function deltaChip(delta){
  if(delta==null) return '';
  const up = delta>0, cls = up?'up':(delta<0?'down':'flat');
  const arrow = up
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M7 17 17 7M9 7h8v8"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M7 7 17 17M17 9v8H9"/></svg>';
  return `<span class="dash-stat-delta dash-stat-delta--${cls}">${arrow}${Math.abs(delta)}%</span>`;
}
function metricCard(m, per){
  const color = FILL[m.variant];
  const fmt = m.money ? fmtMoney : fmtNum;
  const [base,cur,bD,cD] = m.p[per.key];
  const rows = [
    {label:per.base, value:base,  delta:bD, spark: bD>=0?SPARK_UP:SPARK_DOWN},
    {label:per.cur,  value:cur,   delta:cD, spark: cD>=0?SPARK_UP:SPARK_DOWN},
    {label:'MAX',    value:m.max, date:m.maxDate, spark:null},
  ].map(r=>`
    <div class="dash-stat">
      <div class="dash-stat-main">
        <span class="dash-stat-label">${r.label}</span>
        <div class="dash-stat-figure">
          <span class="dash-stat-value">${fmt(r.value)}</span>
          ${r.date ? `<span class="dash-stat-date">${r.date}</span>` : deltaChip(r.delta)}
        </div>
      </div>
      ${r.spark ? sparkSVG(r.spark, color) : ''}
    </div>`).join('');
  return `<section class="dash-metric dash-metric--${m.variant}">
      <header class="dash-metric-head"><span class="dash-metric-title">${m.title}</span></header>
      <div class="dash-metric-body">${rows}</div>
    </section>`;
}
const CHEV = '<svg class="li-chev" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M9 8L13 12L9 16L11 17L16 12L11 7L9 8Z" fill="currentColor"/></svg>';
const SEV_ICON = {
  danger:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 7v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1.25" fill="currentColor"/></svg>',
  warning:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4.5 21 20H3L12 4.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10.5v3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.7" r="1.05" fill="currentColor"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16Z" stroke="currentColor" stroke-width="1.7"/><path d="M12 12V6a6 6 0 0 1 6 6h-6Z" fill="currentColor"/></svg>',
};
function topCard(t){
  const rows = t.items.map(it=>{
    const badge = it.badge ? `<span class="li-badge">${it.badge}</span>` : '';
    return `<div class="list-item"><div class="li-main"><span class="li-name">${it.name}</span><span class="li-sub">${badge}${it.sub}</span></div>${CHEV}</div>`;
  }).join('');
  return `<section class="dash-top">
      <header class="dash-top-head"><span class="dash-top-title">${t.title}</span><a class="dash-top-viewall">View all</a></header>
      <div class="dash-top-list">${rows}</div>
    </section>`;
}
function attentionCard(t){
  const rows = t.items.map(it=>`
    <div class="attn-item">
      <span class="attn-ico attn-ico--${it.sev}">${SEV_ICON[it.sev]}</span>
      <div class="li-main"><span class="li-name">${it.name}</span><span class="li-sub">${it.sub}</span></div>
      <a class="attn-view" href="${it.href}" title="Open ${it.entity}">View</a>
    </div>`).join('');
  return `<section class="dash-top">
      <header class="dash-top-head"><span class="dash-top-title">${t.title}</span><a class="dash-top-viewall dash-top-viewall--accent">${t.count} items</a></header>
      <div class="dash-top-list">${rows}</div>
    </section>`;
}
function bottomCard(t){ return t.type==='attention' ? attentionCard(t) : topCard(t); }
let curVersion='A', curPeriod=PERIODS[0];
function renderMetrics(){
  document.getElementById('metrics').innerHTML = METRICS.map(m=>metricCard(m,curPeriod)).join('');
}
function renderTops(){
  document.getElementById('tops').innerHTML = BOTTOM[curVersion].map(bottomCard).join('');
}
function setVersion(v){
  curVersion = v;
  document.querySelectorAll('.ver-seg__btn').forEach(b=>{
    const on = b.dataset.v===v; b.classList.toggle('is-active', on); b.setAttribute('aria-selected', on);
  });
  renderTops();
}
renderMetrics(); renderTops();
document.querySelector('.ver-seg').addEventListener('click', e=>{
  const btn = e.target.closest('.ver-seg__btn'); if(btn) setVersion(btn.dataset.v);
});

// ---- period picker: DS-styled dropdown; selecting a range re-renders the figures ----
(function(){
  const dd = document.getElementById('periodDd');
  const trigger = dd.querySelector('.dd-trigger');
  const valueEl = dd.querySelector('.dd-value');
  const menu = dd.querySelector('.dd-menu');
  const CHECK = '<span class="dd-item__check"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M16.4169 8.58817C16.8297 8.95509 16.8668 9.58716 16.4999 9.99995L11.7473 15.1643C11.5516 15.3846 11.2686 15.5073 10.974 15.4996C10.6794 15.492 10.4032 15.3548 10.2191 15.1247L7.49992 12C7.15491 11.5687 7.22484 10.9394 7.6561 10.5944C8.08736 10.2494 8.71665 10.3193 9.06166 10.7506L11.0402 12.9495L15.0051 8.67122C15.372 8.25844 16.0041 8.22125 16.4169 8.58817Z" fill="currentColor"/></svg></span>';
  function build(){
    menu.innerHTML = PERIODS.map((p,i)=>
      `<li class="dd-item" role="option" data-i="${i}" aria-selected="${p.key===curPeriod.key}"><span class="dd-item__label">${p.label}</span>${p.key===curPeriod.key?CHECK:''}</li>`).join('');
  }
  function open(){ dd.dataset.open='true'; trigger.setAttribute('aria-expanded','true'); menu.hidden=false; }
  function close(){ dd.dataset.open='false'; trigger.setAttribute('aria-expanded','false'); menu.hidden=true; }
  trigger.addEventListener('click', e=>{ e.stopPropagation(); menu.hidden?open():close(); });
  menu.addEventListener('click', e=>{ const li=e.target.closest('.dd-item'); if(!li) return;
    curPeriod=PERIODS[+li.dataset.i]; valueEl.textContent=curPeriod.label; renderMetrics(); build(); close(); });
  document.addEventListener('click', e=>{ if(!dd.contains(e.target)) close(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') close(); });
  build();
})();
</script>
